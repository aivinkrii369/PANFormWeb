<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PAN Card Fixer — SarkariFixo</title>

  <style>
    body { font-family: Arial; background:#f4f4f4; margin:0; padding:0; }

    header {
      background:#003399; color:white;
      padding:22px 0; text-align:center; margin-bottom:30px;
    }
    header h2 { margin:0; font-size:24px; letter-spacing:10px; }
    header div { font-size:13px; opacity:0.9; margin-top:6px; }

    main {
      max-width:480px; margin:auto; background:white;
      padding:25px; border-radius:12px;
      box-shadow:0 0 12px rgba(0,0,0,0.1);
    }
    h1 { text-align:center; color:#003399; margin-top:0; }
    p { text-align:center; margin-top:-5px; color:#555; }

    label { display:block; margin-top:15px; font-weight:bold; }
    input, textarea {
      width:100%; padding:10px; margin-top:6px;
      border:1px solid #ccc; border-radius:6px;
    }
    textarea { resize:vertical; }

    button {
      width:100%; padding:12px; background:#003399;
      border:none; border-radius:6px;
      color:white; font-size:16px; margin-top:20px;
    }
    button:hover { background:#002070; }

    #msg { text-align:center; margin-top:20px; font-weight:bold; }

    footer {
      background:#eee; text-align:center; padding:15px;
      margin-top:40px; font-size:14px; color:#555;
    }
  </style>
</head>

<body>

<header>
  <h2>S  A  R  K  A  R  I  F  I  X  O</h2>
  <div>Government Form Correction Assistant</div>
</header>

<main>
  <h1>PAN Card Fixer</h1>
  <p>Fix PAN card errors or correction issues.</p>

  <form id="fixerForm" action="/submit/pan">

    <label>Full Name</label>
    <input name="fullName" required placeholder="Your full name">

    <label>Email</label>
    <input name="email" type="email" required placeholder="you@example.com">

    <label>Phone</label>
    <input name="phone" placeholder="Optional mobile number">

    <label>PAN Number</label>
    <input name="panNumber" placeholder="ABCDE1234F">

    <label>Issue Description</label>
    <textarea name="issue" rows="4" required placeholder="Describe your issue"></textarea>

    <input type="hidden" name="service" value="pan">

    <button type="submit">Submit</button>
  </form>

  <p id="msg"></p>
</main>

<footer>
  © 2025 SarkariFixo — All Rights Reserved
</footer>

<script>
const form = document.getElementById("fixerForm");
const msg = document.getElementById("msg");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  msg.textContent = "Submitting… please wait.";
  msg.style.color = "black";

  const data = Object.fromEntries(new FormData(form).entries());

  const response = await fetch("/submit/pan", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(data)
  });

  const result = await response.json();

  if (result.ok) {
    msg.style.color = "green";
    msg.textContent = "✔ Submission successful. Check your email.";
    form.reset();
  } else {
    msg.style.color = "red";
    msg.textContent = "❌ " + result.error;
  }
});
</script>

</body>
</html>
