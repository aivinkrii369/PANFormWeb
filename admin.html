<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — SarkariFixo</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f3f8;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-box {
      width: 340px;
      background: #ffffff;
      padding: 28px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h2 {
      margin: 0;
      margin-bottom: 8px;
      font-size: 20px;
      color: #003399;
      letter-spacing: 5px;
    }

    .subtitle {
      font-size: 13px;
      margin-bottom: 20px;
      color: #555;
    }

    input {
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #003399;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    button:hover {
      background: #002266;
    }

    #msg {
      margin-top: 12px;
      color: red;
      font-size: 14px;
      min-height: 18px;
    }

    .note {
      margin-top: 14px;
      font-size: 12px;
      color: #777;
    }
  </style>

</head>
<body>

  <div class="login-box">
    <h2>SARKARIFIXO</h2>
    <div class="subtitle">Admin Login</div>

    <input id="username" placeholder="Username" autocomplete="username">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button onclick="login()">Login</button>

    <div id="msg"></div>

    <div class="note">
      Default: admin / sarkari123
    </div>
  </div>


<script>
function login() {
  const u = document.getElementById("username").value.trim();
  const p = document.getElementById("password").value.trim();
  const msg = document.getElementById("msg");

  if (u === "admin" && p === "sarkari123") {
    sessionStorage.setItem("sarkari_admin", "yes");
    window.location.href = "/dashboard.html";
  } else {
    msg.textContent = "Invalid login!";
  }
}
</script>

</body>
</html>
